services:
  nginx:
    image: nginx:1.30.6
    container_name: nginx
    ports:
      - '8080:80'
    networks:
      - app-network

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - type: bind
        source: ./storage/postgres
        target: /var/lib/postgresql
    networks:
      - db-network
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app-network:
    name: app-network
  db-network:
    name: db-network
    internal: true
