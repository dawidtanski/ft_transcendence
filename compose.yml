services:
  nextjs:
    container_name: nextjs
    image: dev:current
    build: ./next.js

    networks:
      - app-network
      - db-network

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - type: bind
        source: ./next.js/src
        target: /src/app/src
      - type: bind
        source: ./next.js/public
        target: /src/app/public

  nginx:
    image: nginx:dev
    build: ./ngnix
    container_name: nginx
    ports:
      - '8080:80'
      - '8443:443'
    environment:
        TLS_IPS: ${TLS_IPS:-}
    volumes:
      - type: bind
        source: ./ngnix/ngnix.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./ngnix/certs
        target: /etc/nginx/certs
    depends_on:
      nextjs:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - type: bind
        source: ./storage/postgres
        target: /var/lib/postgresql
    networks:
      - db-network
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app-network:
    name: app-network
  db-network:
    name: db-network
    internal: true
